<!doctype html>
<!-- The website is light only (no theme picker): data-theme pins it, so a
     phone or laptop set to dark mode still gets the light pages. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The text font, fetched with the page instead of after the CSS. The
         extended file carries ₹, which every page shows. -->
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Colours the browser chrome on mobile to match the page it is framing. -->
    <meta name="theme-color" content="#fffef3" />
    <title>TrueGlaz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
