# One origin for the whole app: nginx serves the built SPA and forwards anything
# under /api/ to the API container. The API serves every route (including media)
# under /api/v1, so this one location covers all of it and there is no CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploaded photos and KYC documents go through /api/v1/media — allow a real file.
  client_max_body_size 25m;

  location /api/ {
    # No trailing slash on proxy_pass: the full /api/v1/... path is passed through
    # unchanged, which is what the API expects.
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API's rate limiter reads the client address from the right end of this
    # list; TRUSTED_PROXY_HOPS=1 on the API matches this single nginx hop.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Single-page app: unknown paths fall back to index.html so a refresh on
  # /orders or /admin loads the app instead of a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
