# Builds the iPhone app (apps/mobile) and sends it to TestFlight (TG-172).
#
# The same approach as the Android APK: GitHub's own runners, `expo prebuild`,
# then the platform's build tool, with no Expo build service. Here that is a
# macOS runner and Xcode.
#
# Signing is automatic at export: Xcode uses the App Store Connect API key to
# create (or reuse) the distribution certificate and App Store profile, so no
# certificate or profile is kept anywhere, and no iPhone must be registered. Three secrets and one variable on
# this repository switch the upload on:
#   secrets   ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8 (the whole .p8 file)
#   variable  APPLE_TEAM_ID
# Without them the app is still compiled (for the simulator), which proves the
# iOS build works, and the run says plainly that nothing was uploaded.
#
# macOS minutes cost ten times Linux minutes, so this runs only when started by
# hand (Actions > iOS (TestFlight) > Run workflow), or when this file changes.
name: iOS (TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/friendly-cray-ilaq8o]
    paths:
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # Baked into the bundle at build time, as for the APK.
      EXPO_PUBLIC_API_ORIGIN: https://demo.trueglaz.com
      # Every upload must be higher than the last; the run number always is.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      CI: '1'
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # A variable, as documented; a secret of the same name is accepted too,
      # since the two tabs sit side by side and are easy to swap.
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      HAS_P8: ${{ secrets.ASC_KEY_P8 != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Check the API address
        run: |
          case "$EXPO_PUBLIC_API_ORIGIN" in
            https://?*) echo "API: $EXPO_PUBLIC_API_ORIGIN" ;;
            *) echo "::error::EXPO_PUBLIC_API_ORIGIN must be an https:// address"; exit 1 ;;
          esac

      # Apple only accepts uploads built with a recent SDK, so use the newest
      # Xcode the runner has rather than whatever happens to be the default.
      - name: Newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Upload switched on?
        id: mode
        run: |
          MISSING=""
          [ -n "$ASC_ISSUER_ID" ] || MISSING="$MISSING ASC_ISSUER_ID(secret)"
          [ -n "$ASC_KEY_ID" ] || MISSING="$MISSING ASC_KEY_ID(secret)"
          [ "$HAS_P8" = "true" ] || MISSING="$MISSING ASC_KEY_P8(secret)"
          [ -n "$APPLE_TEAM_ID" ] || MISSING="$MISSING APPLE_TEAM_ID(variable)"
          if [ -z "$MISSING" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect key found: this build will be signed and uploaded to TestFlight (build $IOS_BUILD_NUMBER)."
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not uploading: missing$MISSING. Compiling for the simulator only."
          fi

      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install

      # No key: prove the app compiles and bundles for iOS. Release, so the
      # JavaScript bundle is built too, exactly as it will be for TestFlight.
      - name: Compile for the simulator (no signing)
        if: steps.mode.outputs.upload != 'true'
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace TrueGlaz.xcworkspace -scheme TrueGlaz -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build

      - name: App Store Connect key
        if: steps.mode.outputs.upload == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # Accepted three ways, since all three are easy to paste: the .p8 file
          # as is, the file base64 encoded (as the APNs key is for Parameter
          # Store), or just the key text without the BEGIN/END lines.
          body() { sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t'; }
          B=$(printf '%s' "$ASC_KEY_P8" | body)
          D=$(printf '%s' "$B" | base64 --decode 2>/dev/null | tr -d '\0' || true)
          case "$D" in *"BEGIN PRIVATE KEY"*) B=$(printf '%s' "$D" | body) ;; esac
          umask 077
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$B" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          openssl pkey -in "$KEY" -noout 2>/dev/null || {
            echo "::error::ASC_KEY_P8 is not a usable .p8 key. Paste the whole AuthKey_<id>.p8 file, BEGIN and END lines included."; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # The archive is built unsigned, then given its entitlements (push) with a
      # local ad-hoc signature. Xcode's automatic signing would otherwise sign
      # the archive for development first, and Apple will not make a
      # development profile until an iPhone is registered to the team. App
      # Store signing needs no devices, and happens at export below.
      - name: Archive
        if: steps.mode.outputs.upload == 'true'
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          ARCHIVE="$RUNNER_TEMP/TrueGlaz.xcarchive"
          xcodebuild -workspace TrueGlaz.xcworkspace -scheme TrueGlaz -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO -quiet archive
          APP="$ARCHIVE/Products/Applications/TrueGlaz.app"
          test -d "$APP" || { echo "::error::No app in the archive"; exit 1; }
          ENT=$(ls TrueGlaz/*.entitlements | head -1)
          grep -q aps-environment "$ENT" || { echo "::error::$ENT has no push entitlement"; exit 1; }
          # Inner code first, the app last, as codesign requires.
          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0 \
            | xargs -0 -n1 codesign --force --sign - --timestamp=none
          codesign --force --sign - --timestamp=none --entitlements "$ENT" "$APP"
          echo "Archive entitlements:"; codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true

      - name: Sign for the App Store and check it
        if: steps.mode.outputs.upload == 'true'
        run: |
          set -o pipefail
          opts() {
            cat <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          }
          opts export > "$RUNNER_TEMP/ExportLocal.plist"
          opts upload > "$RUNNER_TEMP/ExportUpload.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TrueGlaz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          # Prove what is about to go to Apple: an App Store signature, and push.
          cd "$RUNNER_TEMP" && rm -rf check && mkdir check && cd check && unzip -q ../export/*.ipa
          codesign -dvv Payload/TrueGlaz.app 2>&1 | grep -E "^Authority=" | head -1
          codesign -d --entitlements - --xml Payload/TrueGlaz.app 2>/dev/null > ent.plist
          plutil -p ent.plist
          grep -q "<key>aps-environment</key>" ent.plist || { echo "::error::The signed app has no push entitlement"; exit 1; }
          codesign -dvv Payload/TrueGlaz.app 2>&1 | grep -q "Authority=Apple Distribution" \
            || { echo "::error::The app is not signed for the App Store"; exit 1; }

      - name: Upload to TestFlight
        if: steps.mode.outputs.upload == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TrueGlaz.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportUpload.plist" -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Uploaded build $IOS_BUILD_NUMBER to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple processes it for 10–30 minutes; it then appears under TestFlight in App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (no upload)
        if: steps.mode.outputs.upload != 'true'
        run: |
          echo "### iOS build compiled (simulator); nothing uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the ASC_ISSUER_ID, ASC_KEY_ID and ASC_KEY_P8 secrets and the APPLE_TEAM_ID variable to upload to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
