# Builds an installable Android APK of the phone app (apps/mobile) that talks to
# the staging API.
#
# Runs on GitHub's Ubuntu runners, which ship the Android SDK, so nothing is
# installed by hand and every build is reproducible from the commit. The APK is
# signed with the standard debug key: fine for testers installing it directly,
# NOT accepted by the Play Store (that needs an upload key kept in a secret).
#
# It runs only when something the app is built from changes: the app itself,
# the shared client (packages/core) or the workspace's dependencies. A
# website-only change does not build an APK (and an app-only change does not
# redeploy the website: see paths-ignore in deploy.yml).
name: Android APK (staging)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/friendly-cray-ilaq8o]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
      - '!**/*.md'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Baked into the bundle at build time; the app has no other way to find
      # the API. Kept here, in review, rather than in a repository variable.
      EXPO_PUBLIC_API_ORIGIN: https://demo.trueglaz.com
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      # An app built without an API address installs fine and then cannot do
      # anything. Refuse to build one.
      - name: Check the API address
        run: |
          case "$EXPO_PUBLIC_API_ORIGIN" in
            https://?*) echo "API: $EXPO_PUBLIC_API_ORIGIN" ;;
            *) echo "::error::EXPO_PUBLIC_API_ORIGIN must be an https:// address (got '$EXPO_PUBLIC_API_ORIGIN'). Set it in .github/workflows/android-apk.yml."; exit 1 ;;
          esac

      # One install for the whole workspace: the app, packages/core and the website.
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit

      # Firebase config for push notifications, from a repository secret. Without
      # it the APK still builds; it just cannot receive pushes.
      - name: Firebase config (push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e "const j=require('./google-services.json'); if(!j.project_info||!j.client) throw new Error('GOOGLE_SERVICES_JSON is not a google-services.json')"
            # It must hold a client for this app's package, or Gradle stops the
            # whole build. A file for another package means no push, not no APK.
            PKG=$(node -p "require('./app.json').expo.android.package")
            FOUND=$(node -p "require('./google-services.json').client.map(c => c.client_info.android_client_info.package_name).join(', ')")
            if node -e "const j=require('./google-services.json'); process.exit(j.client.some(c => c.client_info.android_client_info.package_name === '$PKG') ? 0 : 1)"; then
              echo "Push: Firebase config added for $PKG"
            else
              rm google-services.json
              echo "::warning::GOOGLE_SERVICES_JSON has no Android app '$PKG' (it has: $FOUND). Register '$PKG' in Firebase and update the secret. This APK cannot receive push notifications."
            fi
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK cannot receive push notifications."
          fi

      # Generates the native android/ project from app.json (not committed).
      - run: npx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name it after the commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/trueglaz-staging-${GITHUB_SHA::7}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: trueglaz-staging-apk
          path: apps/mobile/out/*.apk
          retention-days: 30
